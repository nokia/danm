apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-processor
  namespace: example-vnf
spec:
  selector:
    matchLabels:
      app: internal-processor
  replicas: 6
  template:
    metadata:
      labels:
        app: internal-processor
      annotations:
        danm.io/interfaces: |
          [
            {"clusterNetwork":"default", "ip":"dynamic"},
            {"tenantNetwork":"internal", "ip":"dynamic"}
          ]
    spec:
      containers:
      - name: busybox
        imagePullPolicy: IfNotPresent
        image: busybox:latest
        args:
        - sleep
        - "1000"
