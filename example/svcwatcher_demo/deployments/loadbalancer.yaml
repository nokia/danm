apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadbalancer
  namespace: example-vnf
spec:
  selector:
    matchLabels:
      app: loadbalancer
  replicas: 2
  template:
    metadata:
      labels:
        app: loadbalancer
        vnf-type: example-vnf
      annotations:
        danm.io/interfaces: |
          [
            {"clusterNetwork":"default", "ip":"dynamic"},
            {"clusterNetwork":"external", "ip":"dynamic"},
            {"tenantNetwork":"internal", "ip":"dynamic"}
          ]
    spec:
      containers:
      - name: busybox
        imagePullPolicy: IfNotPresent
        image: busybox:latest
        args:
        - sleep
        - "1000"
